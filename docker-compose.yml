version: '3.8'

services:
  lead-qualifier:
    build: .
    container_name: orbyn-lead-qualifier
    restart: always
    env_file: .env.prod
    volumes:
      - /etc/secrets:/etc/secrets:ro  # Google credentials read-only
      - ./logs:/app/logs  # Logs persistentes
    networks:
      - orbyn-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  orbyn-network:
    driver: bridge
